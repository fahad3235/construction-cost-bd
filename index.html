<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construction Cost BD &#8212; House Building Cost Estimator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div>
        <h1 id="title">Construction Cost BD</h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <button id="langBtn" class="lang-btn" type="button">&#2476;&#2494;&#2434;&#2482;&#2494;</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="estimate" type="button" id="tab-estimate"></button>
      <button class="tab" data-tab="rates" type="button" id="tab-rates"></button>
      <button class="tab" data-tab="saved" type="button" id="tab-saved"></button>
      <button class="tab" data-tab="data" type="button" id="tab-data"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- ============ ESTIMATE TAB ============ -->
  <section id="panel-estimate" class="panel">
    <form id="estForm" class="card" novalidate>
      <div class="field">
        <label for="areaInput" id="areaLabel"></label>
        <input id="areaInput" type="number" min="1" max="100000" step="1" value="1200" inputmode="numeric">
        <p class="hint" id="areaHint"></p>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="floorsInput" id="floorsLabel"></label>
          <input id="floorsInput" type="number" min="1" max="10" step="1" value="2" inputmode="numeric">
        </div>
        <div class="field">
          <label for="tierSelect" id="tierLabel"></label>
          <select id="tierSelect"></select>
        </div>
      </div>
      <fieldset class="field">
        <legend id="extrasLabel"></legend>
        <div id="extrasList" class="check-grid"></div>
      </fieldset>
      <p id="estError" class="error" hidden></p>
      <button id="calcBtn" class="btn primary" type="submit"></button>
    </form>

    <div id="results" class="results" hidden>
      <div class="card total-card">
        <div class="total-row"><span id="baseLabel"></span><strong id="baseValue"></strong></div>
        <div class="total-row"><span id="extrasLabel2"></span><strong id="extrasValue"></strong></div>
        <div class="total-row grand"><span id="grandLabel"></span><strong id="grandValue"></strong></div>
        <p class="meta" id="resultMeta"></p>
        <p class="note" id="factorNote" hidden></p>
      </div>

      <div class="card">
        <h2 id="breakdownTitle"></h2>
        <table class="tbl">
          <thead><tr><th id="thCat"></th><th id="thShare"></th><th id="thAmt"></th></tr></thead>
          <tbody id="catBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h2 id="phasesTitle"></h2>
        <table class="tbl">
          <thead><tr><th id="thPhase"></th><th id="thShare2"></th><th id="thAmt2"></th></tr></thead>
          <tbody id="phaseBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h2 id="materialsTitle"></h2>
        <p class="note" id="materialsNote"></p>
        <table class="tbl">
          <thead><tr><th id="thMat"></th><th id="thQty"></th><th id="thUnit"></th><th id="thCost"></th></tr></thead>
          <tbody id="matBody"></tbody>
          <tfoot><tr><td id="matTotalLabel"></td><td></td><td></td><td id="matTotalValue"></td></tr></tfoot>
        </table>
      </div>

      <div class="card">
        <div class="field">
          <label for="saveName" id="saveNameLabel"></label>
          <input id="saveName" type="text" maxlength="80">
        </div>
        <p id="saveError" class="error" hidden></p>
        <p id="saveOk" class="ok" hidden></p>
        <button id="saveBtn" class="btn primary" type="button"></button>
      </div>
    </div>

    <p class="disclaimer" id="disclaimer"></p>
  </section>

  <!-- ============ RATES TAB ============ -->
  <section id="panel-rates" class="panel" hidden>
    <div class="card">
      <h2 id="ratesTitle"></h2>
      <p class="note" id="ratesNote"></p>
      <h3 id="tierRatesTitle"></h3>
      <div id="tierRateFields" class="rate-grid"></div>
      <h3 id="splitsTitle"></h3>
      <p class="note" id="splitsNote"></p>
      <div id="splitFields"></div>
      <h3 id="phasesEditTitle"></h3>
      <div id="phaseFields" class="rate-grid"></div>
      <h3 id="extrasEditTitle"></h3>
      <div id="extraFields" class="rate-grid"></div>
      <h3 id="materialsEditTitle"></h3>
      <div id="materialFields"></div>
      <p id="ratesError" class="error" hidden></p>
      <p id="ratesOk" class="ok" hidden></p>
      <div class="btn-row">
        <button id="saveRatesBtn" class="btn primary" type="button">Save rates</button>
        <button id="resetRatesBtn" class="btn" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ============ SAVED TAB ============ -->
  <section id="panel-saved" class="panel" hidden>
    <div class="card">
      <h2 id="savedTitle"></h2>
      <p id="savedEmpty" class="empty"></p>
      <ul id="savedList" class="saved-list"></ul>
      <p class="total-row"><span id="savedTotalLabel"></span><strong id="savedTotalValue"></strong></p>
      <p id="loadedMsg" class="ok" hidden></p>
    </div>
  </section>

  <!-- ============ DATA TAB ============ -->
  <section id="panel-data" class="panel" hidden>
    <div class="card">
      <h2 id="dataTitle">Data</h2>
      <div class="btn-row">
        <button id="exportBtn" class="btn" type="button"></button>
        <a id="downloadLink" class="btn" hidden download="construction-cost-bd-export.json">Download</a>
      </div>
      <div class="field">
        <label for="importText" id="importLabel">Import JSON</label>
        <textarea id="importText" rows="6"></textarea>
      </div>
      <p id="importOk" class="ok" hidden></p>
      <p id="importFail" class="error" hidden></p>
      <button id="importBtn" class="btn primary" type="button"></button>
    </div>
    <div class="card danger">
      <h2 id="eraseTitle"></h2>
      <p class="note" id="eraseHint"></p>
      <div class="field">
        <input id="eraseInput" type="text" autocomplete="off" placeholder="DELETE">
      </div>
      <p id="eraseWrong" class="error" hidden></p>
      <p id="erasedMsg" class="ok" hidden></p>
      <button id="eraseBtn" class="btn danger-btn" type="button"></button>
    </div>
  </section>
</main>

<footer class="wrap foot">
  <p id="footNote"></p>
</footer>

<script src="logic.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
